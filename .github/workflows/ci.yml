name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Marketplace manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
      - name: Plugin sources use HTTPS git URLs
        # `claude plugin update` clones "github" sources over SSH and fails without an SSH key.
        run: |
          python3 - <<'PY'
          import json
          plugins = json.load(open(".claude-plugin/marketplace.json"))["plugins"]
          bad = [p["name"] for p in plugins
                 if isinstance(p["source"], dict) and not str(p["source"].get("url", "")).startswith("https://")]
          assert not bad, f"give these an https:// url source: {bad}"
          print(f"{len(plugins)} plugin source(s) OK")
          PY
